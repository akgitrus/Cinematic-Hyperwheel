services:
  hyperwheel:
    image: hyperwheel-web:latest
    ports:
      - "8000:8000"
    environment:
      HYPERWHEEL_DATA_DIR: /data/ml-latest
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_BACKDROP_SIZE: ${TMDB_BACKDROP_SIZE:-w1280}
      TMDB_POSTER_SIZE: ${TMDB_POSTER_SIZE:-w185}
      POW_SECRET: ${POW_SECRET}
    volumes:
      - ${HYPERWHEEL_DATA_HOST_PATH}:/data/ml-latest:ro
    restart: unless-stopped