<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinematic Hyperwheel</title>
    <meta name="description" content="Harmony beyond similarity: PCA-driven, color-wheel-inspired movie recommendations." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0a0d14">

    <!-- iOS home-screen behavior: Safari ignores manifest.webmanifest's
         display/theme_color fields, so these are needed separately for
         the app to open standalone (no browser chrome) with a matching
         status bar when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hyperwheel">

    <!-- Open Graph / Twitter card preview, shown when a link to this app
         is shared on Slack, Discord, Twitter/X, etc. The image path is
         relative - most modern crawlers resolve it against the page URL
         fine, but a handful of older/stricter scrapers only accept an
         absolute URL. Self-hosters who hit that should hardcode their
         own deployment's absolute URL here instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cinematic Hyperwheel" />
    <meta property="og:description" content="Harmony beyond similarity: PCA-driven, color-wheel-inspired movie recommendations." />
    <meta property="og:image" content="/logo-lockup-on-dark.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="220" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cinematic Hyperwheel" />
    <meta name="twitter:description" content="Harmony beyond similarity: PCA-driven, color-wheel-inspired movie recommendations." />
    <meta name="twitter:image" content="/logo-lockup-on-dark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
