<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinematic Hyperwheel">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8622E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8622E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- stem: the reference vector / wand, curving up to the cluster of recommendations -->
  <path d="M150,215 Q90,160 100,95" fill="none" stroke="#9aa3b5" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="215" r="5" fill="#8891a7"/>

  <!-- soft halo behind the central point, echoing the wheel's own glow-on-hover points -->
  <circle cx="118" cy="90" r="42" fill="url(#glow)"/>

  <!-- the bouquet: color-wheel-derived recommendation points -->
  <circle cx="78" cy="72" r="14" fill="#7A6BC2"/>
  <circle cx="108" cy="58" r="11" fill="#3FC1E6"/>
  <circle cx="118" cy="90" r="20" fill="#E8622E"/>
  <circle cx="146" cy="82" r="13" fill="#F0B93A"/>
  <circle cx="150" cy="110" r="8" fill="#3FC1E6"/>
</svg>
